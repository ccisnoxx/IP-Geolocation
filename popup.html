<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --paper: #f7f7f7;
      --ink: #111;
      --subtle: #4a4a4a;
      --muted: #747474;
      --line: #dedede;
      --field: #fff;
      --accent: #111;
      --danger: #9b1c1c;
    }

    * { box-sizing: border-box; }

    body {
      width: 380px;
      margin: 0;
      padding: 18px;
      color: var(--ink);
      background: var(--paper);
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--ink);
      margin-bottom: 14px;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
    }

    .note {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .section {
      padding: 14px;
      margin-bottom: 12px;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    .section-title {
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 700;
    }

    .row {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 8px 12px;
      margin-bottom: 8px;
    }

    .label {
      color: var(--subtle);
    }

    .value {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 600;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .actions.three {
      grid-template-columns: 1fr 1fr 1fr;
    }

    button {
      min-height: 38px;
      padding: 9px 10px;
      color: #fff;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button.secondary {
      color: var(--ink);
      background: #fff;
      border-color: var(--line);
    }

    button.is-active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    button:disabled {
      cursor: not-allowed;
      color: var(--muted);
      background: #eee;
      border-color: var(--line);
    }

    .status {
      margin-top: 10px;
      padding-top: 10px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      overflow-wrap: anywhere;
    }

    .status.error {
      color: var(--danger);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">IP定位</div>
    <div class="note">白名单模式</div>
  </header>

  <div class="section">
    <div class="section-title">插件功能</div>
    <div class="actions">
      <button id="master-enable-btn" class="secondary">启用</button>
      <button id="master-disable-btn" class="secondary">关闭</button>
    </div>
    <div id="master-status" class="status">加载中...</div>
  </div>

  <div class="section">
    <div class="section-title">当前网站</div>
    <div class="row">
      <div class="label">域名</div>
      <div id="current-domain" class="value">加载中...</div>
      <div class="label">状态</div>
      <div id="current-status" class="value">加载中...</div>
      <div class="label">匹配规则</div>
      <div id="matched-rule" class="value">-</div>
    </div>
    <div class="actions three">
      <button id="add-domain-btn">加入</button>
      <button id="toggle-domain-btn" class="secondary">停用</button>
      <button id="delete-domain-btn" class="secondary">删除</button>
    </div>
    <div id="domain-status" class="status">只对白名单域名应用页面级伪装。</div>
  </div>

  <div class="section">
    <div class="section-title">当前生效配置</div>
    <div class="row">
      <div class="label">语言</div>
      <div id="summary-language" class="value">-</div>
      <div class="label">时区</div>
      <div id="summary-timezone" class="value">-</div>
      <div class="label">定位</div>
      <div id="summary-geolocation" class="value">-</div>
    </div>
    <div id="summary-status" class="status">未命中白名单时不会注入配置。</div>
  </div>

  <div class="section">
    <div class="section-title">WebRTC 全局模式</div>
    <div class="actions three">
      <button id="webrtc-strict-btn" class="secondary">严格</button>
      <button id="webrtc-compatible-btn" class="secondary">兼容</button>
      <button id="webrtc-off-btn" class="secondary">关闭</button>
    </div>
    <div class="status">WebRTC 是浏览器级设置，全局生效。</div>
  </div>

  <div class="section">
    <div class="section-title">出口 IP 定位</div>
    <div class="row">
      <div class="label">国家</div>
      <div id="last-country" class="value">-</div>
      <div class="label">经纬度</div>
      <div id="last-coordinates" class="value">-</div>
      <div class="label">时区</div>
      <div id="last-timezone" class="value">-</div>
      <div class="label">更新于</div>
      <div id="last-updated" class="value">-</div>
    </div>
    <div class="actions">
      <button id="refresh-btn">刷新定位</button>
      <button id="options-btn" class="secondary">完整配置</button>
    </div>
    <div id="refresh-status" class="status">自动定位用于全局默认配置。</div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
