<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IP定位配置</title>
  <style>
    :root {
      --paper: #f6f6f6;
      --ink: #111;
      --muted: #666;
      --line: #ddd;
      --field: #fff;
      --danger: #9b1c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--ink);
    }

    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    h3 {
      margin: 18px 0 10px;
      font-size: 15px;
    }

    .section {
      padding: 18px;
      margin-bottom: 16px;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 4px;
      font: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .inline {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .inline input[type="checkbox"] {
      width: 18px;
      min-height: 18px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      min-height: 38px;
      padding: 9px 14px;
      color: #fff;
      background: var(--ink);
      border: 1px solid var(--ink);
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button.secondary {
      color: var(--ink);
      background: #fff;
      border-color: var(--line);
    }

    button.danger {
      background: var(--danger);
      border-color: var(--danger);
    }

    .rule-list {
      display: grid;
      gap: 10px;
    }

    .rule-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    .rule-item.is-selected {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .status.error {
      color: var(--danger);
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 760px) {
      main { padding: 16px; }
      .grid { grid-template-columns: 1fr; }
      header { display: block; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>IP定位配置</h1>
      <div class="muted">白名单域名启用，非白名单网站不注入页面级伪装。</div>
    </header>

    <section class="section">
      <h2>全局开关</h2>
      <div class="grid">
        <label class="inline"><input id="master-enabled" type="checkbox"> 启用插件</label>
        <div class="field">
          <label for="webrtc-mode">WebRTC 全局模式</label>
          <select id="webrtc-mode">
            <option value="strict">严格模式</option>
            <option value="compatible">兼容模式</option>
            <option value="off">关闭</option>
          </select>
          <div class="muted">WebRTC 是浏览器级设置，全局生效。</div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>全局默认 Profile</h2>
      <h3>语言</h3>
      <div class="grid">
        <label class="inline"><input id="global-language-enabled" type="checkbox"> 启用语言伪装</label>
        <div class="field">
          <label for="global-language-mode">语言模式</label>
          <select id="global-language-mode"></select>
        </div>
        <div class="field">
          <label for="global-language">navigator.language</label>
          <input id="global-language" type="text" spellcheck="false">
        </div>
        <div class="field">
          <label for="global-languages">navigator.languages</label>
          <input id="global-languages" type="text" spellcheck="false">
        </div>
        <div class="field">
          <label for="global-accept-language">Accept-Language</label>
          <input id="global-accept-language" type="text" spellcheck="false">
        </div>
      </div>

      <h3>时区</h3>
      <div class="grid">
        <label class="inline"><input id="global-timezone-enabled" type="checkbox"> 启用时区伪装</label>
        <div class="field">
          <label for="global-timezone-mode">时区模式</label>
          <select id="global-timezone-mode">
            <option value="auto">跟随 IP</option>
            <option value="manual">手动指定</option>
          </select>
        </div>
        <div class="field">
          <label for="global-timezone-preset">常用时区</label>
          <select id="global-timezone-preset"></select>
        </div>
        <div class="field">
          <label for="global-timezone">自定义 IANA 时区</label>
          <input id="global-timezone" type="text" spellcheck="false">
        </div>
      </div>

      <h3>定位</h3>
      <div class="grid">
        <label class="inline"><input id="global-geo-enabled" type="checkbox"> 启用定位伪装</label>
        <div class="field">
          <label for="global-geo-mode">定位模式</label>
          <select id="global-geo-mode">
            <option value="auto">跟随 IP</option>
            <option value="manual">手动坐标</option>
          </select>
        </div>
        <div class="field">
          <label for="global-latitude">纬度</label>
          <input id="global-latitude" type="number" step="any">
        </div>
        <div class="field">
          <label for="global-longitude">经度</label>
          <input id="global-longitude" type="number" step="any">
        </div>
        <div class="field">
          <label for="global-country">国家/地区标签</label>
          <input id="global-country" type="text">
        </div>
      </div>
    </section>

    <section class="section">
      <h2>白名单域名</h2>
      <div class="grid">
        <div>
          <div id="rule-list" class="rule-list"></div>
          <div class="actions">
            <input id="new-domain" type="text" placeholder="example.com" spellcheck="false">
            <button id="add-rule-btn">添加域名</button>
          </div>
        </div>
        <div id="rule-editor">
          <div class="muted">选择一个域名规则后编辑覆盖项。</div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>导入 / 导出</h2>
      <textarea id="import-export" spellcheck="false"></textarea>
      <div class="actions">
        <button id="export-btn" class="secondary">导出 JSON</button>
        <button id="import-btn" class="secondary">导入 JSON</button>
      </div>
    </section>

    <div class="actions">
      <button id="save-btn">保存配置</button>
      <button id="reload-btn" class="secondary">重新加载</button>
    </div>
    <div id="status" class="status">配置加载中...</div>
  </main>

  <script src="config.js"></script>
  <script src="options.js"></script>
</body>
</html>
