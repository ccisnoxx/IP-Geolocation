name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck source
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Check Chrome acceptance entry (dry-run only)
        run: npm run test:e2e:chrome -- --dry-run

      - name: Upload checked build
        uses: actions/upload-artifact@v4
        with:
          name: vanishgeo-ci-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
