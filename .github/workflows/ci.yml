name: CI

on:
  push:
    branches: ['**']
  pull_request:

# 只读权限：跑校验不需要写任何东西
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 = LTS 下限（也是 package.json engines 声明的下限），24 = 开发机版本。
        # 20 跑不动：`navigator` / `MessageChannel` 那几个全局在 20 里还没有，
        # 有 4 条"还原 / 注入"用例会直接 ReferenceError。
        node: ['22', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # tests/extension-wiring.test.ts 会读 dist/injected/runtime.js：单测依赖构建产物，
      # 所以 Build 必须在 Unit tests 之前（顺序颠倒时本地有 dist 看不出来，CI 必红）
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Core branch coverage
        run: npm run test:coverage:core

      # 横幅是渲染产物：PNG 与 SVG 尺寸对不上就说明改了源文件没重新渲染
      - name: Verify banner renders
        run: node scripts/render-banner.mjs --check

      - name: Verify build output
        run: |
          test -f dist/manifest.json
          test -f dist/injected/runtime.js
          test -f dist/content/content.js
          test -f dist/background/service-worker.js
          node -e "const m=require('./dist/manifest.json'); if(m.manifest_version!==3) process.exit(1);"

  # 三个 preset 的烘焙值是各算各的：单测只能证明"参数被算出来了"，证明不了
  # "页面的第一个内联脚本读到的是它"。这个 job 把三个包都真开一次浏览器。
  smoke-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package built-in presets
        run: node scripts/release.mjs --all-presets --out=release

      - name: Smoke every package in a real browser
        run: npm run smoke:release -- --dir=release --require=3

      - name: Upload packages on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: release/*.zip
          retention-days: 3

  # 面板 / 注入层的回归只在真浏览器里看得见：jsdom 单测证明不了"选择器还在"、
  # 证明不了"补丁真的挂上了 worker"。2026-10-29 面板改版把 smoke-ip-apply 的
  # 选择器改没了，单测全绿、CI 也绿，只有手动跑冒烟才发现 —— 所以这一批进 CI。
  #
  # 只收"不依赖外网"的：归属地 / 语言请求全部走本地 HTTPS 桩
  # （host-resolver-rules 把域名指到 127.0.0.1），自签证书由 tools/lib/certs.mjs
  # 现生成（runner 自带 openssl）。real-site / ip-change / ip-follow / failclosed /
  # fingerprint 要真出口，留在本地与夜跑。
  smoke-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 冒烟脚本读 dist/（有的还要 baked 产物），所以先构建
      - name: Build
        run: npm run build

      - name: Preflight Chrome
        run: |
          set -euo pipefail
          node -e "import('./tools/lib/cdp.mjs').then(m => console.log('chrome:', m.CHROME_PATH))"
          CHROME="$(node -e "import('./tools/lib/cdp.mjs').then(m => console.log(m.CHROME_PATH))")"
          test -x "$CHROME" || { echo "找不到可执行的 Chrome：$CHROME"; exit 1; }
          "$CHROME" --version

      - name: Build a persona for the UI smokes
        run: |
          # options / popup 验的是「烘焙构建里的静态 ruleset + 面板接线」，默认去
          # ~/.vanishgeo/profiles/<persona>/ext 找。runner 上没这个目录，所以先用
          # 仓库自带预设（tools/personas/）烘一份，再用 --extension 指过去。
          node scripts/build-persona.mjs --persona=us-la-1 --out="$RUNNER_TEMP/vg-persona"

      - name: Offline browser smokes
        run: |
          set -euo pipefail
          # theme 用 dist（验的是面板本身），其余各用各的构建：
          #   - presets / baked-* / cold-* 脚本内部自己烘 fixture
          #   - options / popup 用上面那份 persona
          # 一条红了继续跑下一条：这个 job 的价值就是在 Linux 上把 12 条都过一遍，
          # 停在第一条等于每修一次只能看到一条问题
          failed=""
          for script in presets frames workers bfcache cold-start cold-save \
                        baked-clear baked-failclosed ip-apply theme options popup; do
            extra=""
            case "$script" in
              options|popup) extra="--extension=$RUNNER_TEMP/vg-persona" ;;
            esac
            echo "=== smoke:$script ==="
            if ! timeout 300 node "tools/smoke-$script.mjs" $extra; then
              failed="$failed $script"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::这些冒烟在 CI 环境里红了:$failed"
            exit 1
          fi

      - name: No stray browsers left behind
        if: always()
        run: |
          # 每个脚本都该把自己起的浏览器收干净（tools/lib/cdp.mjs 里有 exit 兜底）。
          # 留一堆 headless 实例会拖垮后面的 job，所以这里当成断言来跑。
          left=1
          for attempt in 1 2 3 4 5; do
            # 三种前缀对应三种临时 profile：vg-*（多数冒烟）、vanishgeo-*（cold-start /
            # ip-* 那几条）、audit-profile（audit.mjs）
            left="$(pgrep -f 'user-data-dir=.*/(vg-|vanishgeo-|audit-profile)' | wc -l | tr -d ' ')"
            if [ "$left" = "0" ]; then break; fi
            echo "attempt $attempt: leftover=$left"
            sleep 2
          done
          echo "leftover: $left"
          test "$left" = "0"
