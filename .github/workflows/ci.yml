name: CI

on:
  push:
    branches: ['**']
  pull_request:

# 只读权限：跑校验不需要写任何东西
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 = LTS 下限（也是 package.json engines 声明的下限），24 = 开发机版本。
        # 20 跑不动：`navigator` / `MessageChannel` 那几个全局在 20 里还没有，
        # 有 4 条"还原 / 注入"用例会直接 ReferenceError。
        node: ['22', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # tests/extension-wiring.test.ts 会读 dist/injected/runtime.js：单测依赖构建产物，
      # 所以 Build 必须在 Unit tests 之前（顺序颠倒时本地有 dist 看不出来，CI 必红）
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Core branch coverage
        run: npm run test:coverage:core

      # 横幅是渲染产物：PNG 与 SVG 尺寸对不上就说明改了源文件没重新渲染
      - name: Verify banner renders
        run: node scripts/render-banner.mjs --check

      - name: Verify build output
        run: |
          test -f dist/manifest.json
          test -f dist/injected/runtime.js
          test -f dist/content/content.js
          test -f dist/background/service-worker.js
          node -e "const m=require('./dist/manifest.json'); if(m.manifest_version!==3) process.exit(1);"