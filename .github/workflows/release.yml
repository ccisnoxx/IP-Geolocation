name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# 创建 Release 需要写 issue/release；不给会直接 403。
# 注意 contents: write 是"创建 release + 上传产物"的最小集合，别再放宽到其它 scope。
permissions:
  contents: write

concurrency:
  # 同一个 tag 重复推（或重打）时不要让两个发布流程同时改同一份 Release 资产
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 发出去的包必须是"类型干净 + 单测全过"的那一份，所以校验在打包之前
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 有几条接线用例要读 dist/injected/runtime.js（源码不等于产物），所以先构建
      - name: Build extension
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Core branch coverage
        run: npm run test:coverage:core

      # 安全模块（消息来源策略 / opaque frame 证据 / 函数伪装 / 补丁开关）单独一档：
      # 它们退化的表现是"页面能看出被改过"，单测不会红，只有覆盖率会红。
      - name: Security branch coverage
        run: npm run test:coverage:security

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Check manifest version matches tag
        run: |
          MANIFEST_VERSION=$(node -p "require('./dist/manifest.json').version")
          if [ "$MANIFEST_VERSION" != "${{ steps.get_version.outputs.VERSION }}" ]; then
            echo "manifest.json version ($MANIFEST_VERSION) != tag (${{ steps.get_version.outputs.VERSION }})" >&2
            exit 1
          fi

      - name: Create distribution zip
        run: |
          cd dist
          zip -r ../vanishgeo-v${{ steps.get_version.outputs.VERSION }}.zip .
          cd ..

      # release/ 在 .gitignore 里，但重跑历史 job / 本地调试时会留着上一版产物：
      # 那就可能把 2.4.1 的 zip 一起传进 2.4.2 的 Release。
      - name: Clean release directory
        run: rm -rf release

      # 上面那个 zip 是开发构建：配置要经一次异步 IPC 才进页面，页面的第一个内联
      # 脚本可能先跑。这一步额外产出烘焙构建（每个 preset 一份），首屏零窗口。
      # 三道闸（产物里有目标时区 / 经典脚本 / 静态规则非空）不过就不出包。
      - name: Bake per-preset builds
        run: npm run release -- --all-presets --out=release

      - name: Verify baked builds
        run: |
          for zip in release/*.zip; do
            node scripts/release.mjs --check="$zip"
          done

      # 单测只能证明"参数被算出来了"，证明不了"页面第一个内联脚本读到的就是它"。
      # 浏览器冒烟必须挡在创建 Release **之前**：以前它在另一条并行的 CI 里跑，
      # Release 可能先发布、冒烟随后红，坏资产已经挂在 Release 上了。
      - name: Preflight Chrome
        run: |
          set -euo pipefail
          CHROME="$(node -e "import('./tools/lib/cdp.mjs').then(m => console.log(m.CHROME_PATH))")"
          test -x "$CHROME" || { echo "找不到可执行的 Chrome：$CHROME"; exit 1; }
          "$CHROME" --version

      - name: Smoke every package in a real browser
        run: |
          set -euo pipefail
          # --require 的数量必须等于实际产出的包数，别再写死 3：
          # preset 增删时写死的那一端会变成"少验一个包也算通过"。
          PRESETS="$(node -e "import('./scripts/lib/presets.mjs').then(m => console.log(m.readPresets(process.cwd()).length))")"
          echo "presets: $PRESETS"
          npm run smoke:release -- --dir=release --require="$PRESETS"

      # 正文不手写：域名条数、预设包清单、安全承诺全部从 default-domains.json /
      # DEFAULT_PROFILES / release/*.zip 生成。写死过的"13 个域名""五个预设包"
      # "私有 MessagePort" 就是这么和产物分叉的（见 tests/release-notes.test.ts）。
      # 变更日志取自仓库里的 CHANGELOG.md 的 `## <version>` 小节。早先这里是现算
      # `git log 上一个 tag..HEAD`：checkout 默认 shallow，上一个 tag 不在本地，
      # 于是 v2.4.2 的正文写成了「VanishGeo 首个发布」—— 又一个"正文和源码分叉"。
      - name: Generate release notes
        run: |
          node scripts/release-notes.mjs \
            --version="${{ steps.get_version.outputs.VERSION }}" \
            --release-dir=release \
            --changelog-md=CHANGELOG.md \
            --out="$RUNNER_TEMP/release-notes.md"
          echo '--- release body ---'
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vanishgeo-v${{ steps.get_version.outputs.VERSION }}.zip
            release/*.zip
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanishgeo-v${{ steps.get_version.outputs.VERSION }}
          path: dist/
          retention-days: 30

      - name: Upload packages on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-zips-v${{ steps.get_version.outputs.VERSION }}
          path: |
            release/*.zip
            release/*.json
          retention-days: 3