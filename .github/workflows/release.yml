name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck source
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Check Chrome acceptance entry (dry-run only)
        run: npm run test:e2e:chrome -- --dry-run

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: bash scripts/release-changelog.sh > "$RUNNER_TEMP/vanishgeo-changelog.md"

      - name: Create distribution zip
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          cd dist
          zip -r "../vanishgeo-v${VERSION}.zip" .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: vanishgeo-v${{ steps.get_version.outputs.VERSION }}.zip
          body_path: ${{ runner.temp }}/vanishgeo-changelog.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanishgeo-v${{ steps.get_version.outputs.VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
