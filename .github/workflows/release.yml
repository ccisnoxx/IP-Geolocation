name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# 创建 Release 需要写 issue/release；不给会直接 403。
# 注意 contents: write 是"创建 release + 上传产物"的最小集合，别再放宽到其它 scope。
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 发出去的包必须是"类型干净 + 单测全过"的那一份，所以校验在打包之前
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 有几条接线用例要读 dist/injected/runtime.js（源码不等于产物），所以先构建
      - name: Build extension
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Core branch coverage
        run: npm run test:coverage:core

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Check manifest version matches tag
        run: |
          MANIFEST_VERSION=$(node -p "require('./dist/manifest.json').version")
          if [ "$MANIFEST_VERSION" != "${{ steps.get_version.outputs.VERSION }}" ]; then
            echo "manifest.json version ($MANIFEST_VERSION) != tag (${{ steps.get_version.outputs.VERSION }})" >&2
            exit 1
          fi

      - name: Create distribution zip
        run: |
          cd dist
          zip -r ../vanishgeo-v${{ steps.get_version.outputs.VERSION }}.zip .
          cd ..

      # 上面那个 zip 是开发构建：配置要经一次异步 IPC 才进页面，页面的第一个内联
      # 脚本可能先跑。这一步额外产出烘焙构建（每个 preset 一份），首屏零窗口。
      # 三道闸（产物里有目标时区 / 经典脚本 / 静态规则非空）不过就不出包。
      - name: Bake per-preset builds
        run: npm run release -- --all-presets --out=release

      - name: Verify baked builds
        run: |
          for zip in release/*.zip; do
            node scripts/release.mjs --check="$zip"
          done

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG="- VanishGeo 首个发布"
          else
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s" | grep -v "Merge pull request" || echo "- 修复与改进")
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vanishgeo-v${{ steps.get_version.outputs.VERSION }}.zip
            release/*.zip
          body: |
            ## VanishGeo v${{ steps.get_version.outputs.VERSION }}

            ### 安装 / Installation

            1. 下载 `vanishgeo-v${{ steps.get_version.outputs.VERSION }}.zip` / Download the zip
            2. 解压 / Extract it
            3. 打开 `chrome://extensions/`，启用「开发者模式」 / Open `chrome://extensions/` and enable Developer mode
            4. 「加载已解压的扩展程序」→ 选择解压出来的文件夹 / Load unpacked → pick the extracted folder

            首次安装会自动启用内置的 13 个域名规则（`src/shared/default-domains.json`）。
            The built-in allowlist of 13 domains is enabled on first install.

            ### 零首屏窗口（可选）/ Zero first-paint window

            `vanishgeo-v…zip` 是开发构建：配置经异步 IPC 进页面，页面的**第一个内联脚本**
            可能读到原生值。要彻底关掉这个窗口，用按城市烘焙好的包：

            ```
            vanishgeo-${{ steps.get_version.outputs.VERSION }}-singapore.zip    Asia/Singapore   en-SG
            vanishgeo-${{ steps.get_version.outputs.VERSION }}-japan.zip        Asia/Tokyo       ja-JP
            vanishgeo-${{ steps.get_version.outputs.VERSION }}-germany.zip      Europe/Berlin    de-DE
            vanishgeo-${{ steps.get_version.outputs.VERSION }}-united-states.zip America/New_York en-US
            vanishgeo-${{ steps.get_version.outputs.VERSION }}-china.zip        Asia/Shanghai    zh-CN
            ```

            配置已编译进 `injected/runtime.js`，`document_start` 同步生效。安装方式同上。
            其余城市/地区可本地构建：`npm run release -- --preset=<id>`（见 CONFIG_GUIDE §十）。

            ### 更新日志 / Changelog

            ${{ steps.changelog.outputs.CHANGELOG }}

            ### 功能 / Features

            - 时区 / 语言 / 地理位置 / canvas 四层一致伪装
            - 请求头与页面内 API 同源，`Accept-Language` 由 DNR 在首个请求前改好
            - 反检测：原生签名、WebIDL 形状、会话固定偏移、私有 MessagePort 下发配置
            - 域名规则支持显式排除（`!mail.google.com`），最长匹配优先
            - WebRTC 防泄漏、失败即关闭（fail-closed）并给出可见提示

            完整文档见 README.md。
          draft: false
          prerelease: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanishgeo-v${{ steps.get_version.outputs.VERSION }}
          path: dist/
          retention-days: 30