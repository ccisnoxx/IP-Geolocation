<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IP定位测试页</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      color: #111;
      background: #f7f7f7;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 20px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 24px;
    }

    dl {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 10px 14px;
    }

    dt {
      color: #555;
      font-weight: 700;
    }

    dd {
      margin: 0;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    button {
      min-height: 38px;
      padding: 9px 14px;
      color: #fff;
      background: #111;
      border: 1px solid #111;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>IP定位测试页</h1>
    <button id="refresh">刷新检测值</button>
    <dl>
      <dt>navigator.language</dt>
      <dd id="language">-</dd>
      <dt>navigator.languages</dt>
      <dd id="languages">-</dd>
      <dt>Intl timezone</dt>
      <dd id="timezone">-</dd>
      <dt>Date#getTimezoneOffset()</dt>
      <dd id="offset">-</dd>
      <dt>Date#toString()</dt>
      <dd id="date-string">-</dd>
      <dt>navigator.geolocation</dt>
      <dd id="geolocation">等待授权或回调...</dd>
    </dl>
  </main>

  <script>
    function render() {
      document.getElementById('language').textContent = navigator.language;
      document.getElementById('languages').textContent = JSON.stringify(navigator.languages);
      document.getElementById('timezone').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;
      document.getElementById('offset').textContent = String(new Date().getTimezoneOffset());
      document.getElementById('date-string').textContent = new Date().toString();
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
          document.getElementById('geolocation').textContent = JSON.stringify({
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy
          });
        }, (error) => {
          document.getElementById('geolocation').textContent = `${error.code}: ${error.message}`;
        });
      }
    }

    document.getElementById('refresh').addEventListener('click', render);
    render();
  </script>
</body>
</html>
