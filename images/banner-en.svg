<?xml version="1.0" encoding="UTF-8"?>
<!--
  VanishGeo banner（1774×887）

  这是**源文件**，PNG 由它渲染得到：
      node scripts/render-banner.mjs
  改字标/配色只改这里，不要直接改 images/banner-*.png。

  配色取自 images/icon.png：底色 #05090d，主色绿 #4caf50，亮绿 #58e06a。
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1774" height="887" viewBox="0 0 1774 887">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c11"/>
      <stop offset="0.55" stop-color="#05090d"/>
      <stop offset="1" stop-color="#040709"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#4caf50" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#2f7d3a" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globeGlow" cx="0.83" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#58e06a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4caf50" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4caf50" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect x="150" y="292" width="200" height="200" rx="44"/></clipPath>
  </defs>

  <rect width="1774" height="887" fill="url(#bg)"/>
  <rect width="1774" height="887" fill="url(#glow)"/>
  <rect width="1774" height="887" fill="url(#globeGlow)"/>

  <!-- 右侧装饰：经纬网，暗示 Geo；压到很低的不透明度，不抢字标 -->
  <g transform="translate(1400 444)" fill="none" stroke="#4caf50" stroke-opacity="0.13">
    <circle r="268" stroke-width="1.5"/>
    <circle r="196" stroke-width="1"/>
    <ellipse rx="96" ry="268" stroke-width="1"/>
    <ellipse rx="188" ry="268" stroke-width="1"/>
    <path d="M -268 0 H 268" stroke-width="1"/>
    <path d="M -236 -96 H 236" stroke-width="1" stroke-opacity="0.7"/>
    <path d="M -236 96 H 236" stroke-width="1" stroke-opacity="0.7"/>
  </g>

  <!-- 顶部小标签 -->
  <text x="152" y="176" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="600"
        letter-spacing="7" fill="#5fbe6d" fill-opacity="0.9">CHROME MV3 EXTENSION</text>

  <!-- 图标底板：图标本身是深色素描 + 白底，所以放进白色圆角方块里当作 app 图标 -->
  <g>
    <rect x="150" y="292" width="200" height="200" rx="44" fill="#f7f9f8"/>
    <image x="186" y="328" width="128" height="128" clip-path="url(#tile)"
           xlink:href="data:image/png;base64,"/>
  </g>

  <!-- 字标 -->
  <text x="404" y="432" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="152" font-weight="700"
        letter-spacing="-3" fill="#ffffff">VanishGeo</text>

  <!-- 字标下的短绿线 -->
  <rect x="406" y="464" width="196" height="5" rx="2.5" fill="url(#rule)"/>

  <!-- 主标语 -->
  <text x="404" y="540" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="38" font-weight="500"
        fill="#cfd8d6">Timezone · Language · Geolocation · Fonts</text>

  <!-- 副标语 -->
  <text x="404" y="598" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="30" font-weight="400"
        fill="#7d8f8c" fill-opacity="0.95">Page, request headers and the real exit tell one story</text>

  <!-- 底部说明 -->
  <text x="152" y="772" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="26" font-weight="400"
        fill="#6b7b78" fill-opacity="0.85">三层一致：进程环境 / 请求头（DNR）/ 页面 JS</text>
</svg>
